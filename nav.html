<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin IPS – Ajouter un projet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

  <!-- Header -->
  <header class="w-full bg-white shadow-sm flex justify-between items-center px-8 py-4">
    <div class="flex items-center space-x-3">
      <img src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Logo_placeholder.png" alt="Logo IPS" class="h-10">
      <span class="font-semibold text-lg text-green-700">Institut Pour le Progrès Social</span>
    </div>
    <div class="flex items-center space-x-3 text-green-700">
      <span>Vous êtes connecté en tant que : <strong>Admin IPS</strong></span>
      <div class="bg-green-600 text-white p-2 rounded-full">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5.121 17.804A9 9 0 1118.364 4.56M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
      </div>
    </div>
  </header>

  <div class="flex flex-1">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r p-6 space-y-6">
      <nav class="space-y-3">
        <a href="#" class="flex items-center px-3 py-2 hover:bg-green-50 rounded-md text-gray-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4v16m8-8H4" />
          </svg>
          Ajout de blog
        </a>

        <a href="#" class="flex items-center px-3 py-2 bg-green-600 text-white rounded-md font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 4H7a2 2 0 01-2-2V6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v12a2 2 0 01-2 2z" />
          </svg>
          Ajout de projet
        </a>

        <a href="#" class="flex items-center px-3 py-2 hover:bg-green-50 rounded-md text-gray-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7" />
          </svg>
          Déconnexion
        </a>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="flex-1 px-10 py-10">
      <h1 class="text-2xl font-semibold mb-6">Ajouter un nouveau projet</h1>

      <form id="projectForm" class="space-y-6 max-w-3xl">

        <!-- Nom -->
        <div>
          <label class="block font-medium mb-2">Nom du projet</label>
          <input type="text" placeholder="Saisir le titre"
            class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none"
            required>
        </div>

        <!-- Catégorie -->
        <div>
          <label class="block font-medium mb-2">Catégorie</label>
          <select
            class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none"
            required>
            <option value="">Choisir une catégorie</option>
            <option>Jeunesse & Éducation</option>
            <option>Environnement</option>
            <option>Santé</option>
            <option>Culture & Sport</option>
          </select>
        </div>

        <!-- Image -->
        <div>
          <label class="block font-medium mb-2">Image de couverture</label>
          <input id="imageUpload" type="file" accept="image/*"
            class="w-full border border-gray-300 rounded-md px-4 py-2 cursor-pointer focus:ring-2 focus:ring-green-500 outline-none">
          <img id="previewImage" src="" alt="Aperçu" class="mt-4 hidden rounded-md border max-h-48 object-cover">
        </div>

        <!-- Description -->
        <div>
          <label class="block font-medium mb-2">Description</label>
          <textarea placeholder="Rédiger une description du projet"
            class="w-full border border-gray-300 rounded-md px-4 py-2 h-40 resize-none focus:ring-2 focus:ring-green-500 outline-none"
            required></textarea>
        </div>

        <!-- Organisateur -->
        <div>
          <label class="block font-medium mb-2">Organisateur du projet</label>
          <input type="text" placeholder="Saisir le nom"
            class="w-full border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none"
            required>
        </div>

        <!-- Dates -->
        <div>
          <label class="block font-medium mb-2">Date de démarrage / achèvement</label>
          <div class="grid grid-cols-2 gap-4">
            <input type="date"
              class="border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none" required>
            <input type="date"
              class="border border-gray-300 rounded-md px-4 py-2 focus:ring-2 focus:ring-green-500 outline-none" required>
          </div>
        </div>

        <!-- Statut -->
        <div>
          <label class="block font-medium mb-2">Statut du projet</label>
          <div class="flex space-x-6">
            <label class="flex items-center space-x-2">
              <input type="radio" name="status" value="En cours" class="text-green-600 focus:ring-green-500" checked>
              <span>En cours</span>
            </label>
            <label class="flex items-center space-x-2">
              <input type="radio" name="status" value="Terminé" class="text-green-600 focus:ring-green-500">
              <span>Terminé</span>
            </label>
          </div>
        </div>

        <!-- Boutons -->
        <div class="flex space-x-4 pt-4">
          <button type="reset"
            class="px-6 py-2 bg-green-100 text-green-700 rounded-md hover:bg-green-200 transition">Annuler</button>
          <button type="submit"
            class="px-6 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 transition">Publier l’article</button>
        </div>
      </form>
    </main>
  </div>

  <!-- Footer -->
  <footer class="bg-green-700 text-white text-center py-4 text-sm mt-auto">
    © 2025 IPS – Interface d’administration. Tous droits réservés.
  </footer>

  <script>
    // Aperçu image
    const imageInput = document.getElementById('imageUpload');
    const previewImage = document.getElementById('previewImage');

    imageInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          previewImage.src = reader.result;
          previewImage.classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    // Message de confirmation
    document.getElementById('projectForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('✅ Projet publié avec succès !');
      e.target.reset();
      previewImage.classList.add('hidden');
    });
  </script>

</body>
</html>
